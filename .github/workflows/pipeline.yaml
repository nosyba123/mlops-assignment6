name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. الـ Linter (الخطوة الخفيفة اللي لازم تنجح الأول)
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install flake8
      - name: Run Linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # 2. الـ Train (الخطوة الغالية اللي ليها شروط صارمة)
  train:
    needs: linter # الشرط الأول: الـ linter لازم ينجح
    # الشرط الثاني والثالث: لازم يكون فرع main والرسالة فيها [run-train]
    if: |
      github.ref == 'refs/heads/main' && 
      contains(github.event.head_commit.message, '[run-train]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Training Script
        run: python train.py

      # الخطوة المطلوبة في حال الفشل: رفع الـ Artifact
      - name: Upload Error Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error_logs
          path: error_logs.txt # تأكدي إن الكود بتاعك بيطلع ملف بالاسم ده لو فشل

  # 3. خطوة التنظيف النهائية (تشتغل دايماً)
  cleanup:
    needs: [linter, train]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Message
        run: echo "Cleaning up temporary cloud volumes..."