name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "*"

jobs:

  linter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Run linter
        run: |
          echo "Linting..."
          pip install flake8
          flake8 . || exit 1

  train:
    runs-on: ubuntu-latest
    needs: linter

    if: >
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[run-train]') &&
      needs.linter.result == 'success'

    steps:
      - uses: actions/checkout@v3

      - name: Run training
        run: |
          echo "Training..."
          exit 1

      - name: Save logs
        if: failure()
        run: echo "error happened" > error_logs.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: logs
          path: error_logs.txt

      - name: Cleanup
        if: always()
        run: echo "Cleaning up temporary cloud volumes..."